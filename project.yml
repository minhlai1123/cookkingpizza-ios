name: PizzaCookingWorld
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

targets:
  PizzaCookingWorld:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.pizzacooking
      PRODUCT_NAME: PizzaCookingWorld
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad
      SWIFT_VERSION: "5.9"
      ENABLE_PREVIEWS: YES
      GENERATE_PROFILING_CODE: NO
  
  PizzaCookingWorldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PizzaCookingWorld
