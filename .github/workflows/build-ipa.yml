name: Build iOS IPA

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build App for iOS Device (Unsigned)
        run: |
          xcodebuild build \
            -project PizzaCookingWorld.xcodeproj \
            -scheme PizzaCookingWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1 || {
              echo "=== XCODEBUILD FAILED ==="
              tail -n 60 build.log
              ERRORS=$(grep -i "error:" build.log | tr '\n' ' ' | cut -c 1-500)
              echo "::error::Xcodebuild failure: $ERRORS"
              exit 1
            }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log

      - name: Package PizzaCookingWorld.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PizzaCookingWorld.app build/Payload/
          cd build
          zip -r -q PizzaCookingWorld.ipa Payload
          cd ..
          ls -lh build/PizzaCookingWorld.ipa

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PizzaCookingWorld-iOS-IPA
          path: build/PizzaCookingWorld.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Pizza Cooking World iOS v1.0.0"
          draft: false
          prerelease: false
          make_latest: true
          files: build/PizzaCookingWorld.ipa
          body: |
            ## 🍕 Pizza Cooking World - Bản Cài Đặt iOS (IPA)
            Tương thích hoàn toàn với iOS 16.0+ (kể cả iPhone 8 Plus) và iOS 17+.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
